# Cloudflare Tunnel config for the shared dev tunnel.
#
# Hostname: dashboard.dev.rivet.dev (one tunnel shared across the team).
# Only one developer can run this at a time — coordinate before starting.
#
# Setup:
#   1. Get the tunnel credentials JSON from 1Password (item: "rivet dev tunnel").
#      Save it to ~/.cloudflared/dashboard-dev.json
#   2. Copy this file to ~/.cloudflared/dashboard-dev.yml
#   3. Replace <TUNNEL_UUID> with the UUID from the credentials file (filename or `tunnel` field).
#   4. Run: cloudflared tunnel --config ~/.cloudflared/dashboard-dev.yml run
#
# See docs-internal/platform/dev-tunnel.md for the full runbook.

tunnel: <TUNNEL_UUID>
credentials-file: ~/.cloudflared/dashboard-dev.json

ingress:
  - hostname: dashboard.dev.rivet.dev
    service: http://localhost:43708
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
  - service: http_status:404
